#MAKE A FILE "mongo-init.js" with the following code (Remove hashes)
#db = db.getSiblingDB(process.env.MONGO_INITDB_DATABASE);
#db.createCollection("users");
#db.createCollection("contacts");
#db.createCollection("chats");

#MAKE an .env file as following (Remove hashes)
#MONGO_ROOT_USER=root
#MONGO_ROOT_PASSWORD=whatever
#MONGO_DB_NAME=chattingapp

#keep the .env and mongo-init.js beside the docker-compose.yml

services:
  mongo-db:
    image: mongo:7
    container_name: chat-mongo-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "27017:27017"   # optional — remove if you don't need host access to the DB
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: >
        mongosh --quiet --eval
        "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chat-net

  backend:
    build:
      context: https://github.com/gajen007/ChattingAppBackend.git#forReactNative
      dockerfile: .Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo-db:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - chat-net

  sender-frontend:
    build:
      context: https://github.com/gajen007/ChattingApp.git#withClaude.ai
      dockerfile: .Dockerfile
      args:
        WEB_PORT: 3001
    container_name: chat-sender-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - chat-net

  receiver-frontend:
    build:
      context: https://github.com/gajen007/ChattingApp.git#withClaude.ai
      dockerfile: .Dockerfile
      args:
        WEB_PORT: 3002
    container_name: chat-receiver-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge

volumes:
  mongo-data:
